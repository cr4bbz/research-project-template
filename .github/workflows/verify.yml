name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static contract (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - run: python scripts/check.py --static
      - run: python -m unittest discover -s tests -v

  verify:
    needs: static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - id: profile
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import tomllib
          with open("PROJECT_PROFILE.toml", "rb") as profile:
              modules = tomllib.load(profile)["modules"]
          for name, active in modules.items():
              print(f"{name}={str(active).lower()}")
          PY
      - if: steps.profile.outputs.formal == 'true'
        uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596
        with:
          build: false
          test: false
          use-github-cache: false
          lake-package-directory: formal/lean
      - run: python scripts/check.py
      - if: steps.profile.outputs.paper == 'true'
        uses: xu-cheng/latex-action@e2f99d4b3685b0da93f97e1b86ad8fab81105098
        with:
          root_file: main.tex
          working_directory: paper
          latexmk_use_xelatex: false
